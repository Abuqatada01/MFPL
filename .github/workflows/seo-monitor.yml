
name: Medicosmo SEO Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  seo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install SEO checker
        run: npm install --no-save --package-lock=false cheerio@1.0.0

      - name: Check website SEO and links
        env:
          WEBSITE_URL: https://www.medicosmoformulations.com
        run: |
          node <<'NODE'
          const cheerio = require("cheerio");

          function normalizeUrl(input, relativeTo) {
            const url = new URL(input, relativeTo);
            url.hash = "";
            url.pathname =
              url.pathname.replace(/\/+$/, "") || "/";
            return url.href;
          }

          const base = normalizeUrl(process.env.WEBSITE_URL);
          const origin = new URL(base).origin;

          const visited = new Set();
          const queued = new Set([base]);
          const queue = [base];
          const problems = [];
          const titles = new Map();
          const descriptions = new Map();
          const maxPages = 30;

          async function checkPage(url) {
            try {
              const response = await fetch(url, {
                signal: AbortSignal.timeout(10000)
              });

              if (!response.ok) {
                problems.push(`${url}: HTTP ${response.status}`);
                return;
              }

              const contentType =
                response.headers.get("content-type") || "";

              if (!contentType.includes("text/html")) return;

              const finalUrl = normalizeUrl(response.url);
              const html = await response.text();
              const $ = cheerio.load(html);

              const title = $("title").first().text().trim();
              const description =
                $('meta[name="description"]')
                  .attr("content")?.trim();

              if (!title) {
                problems.push(`${url}: Missing title`);
              }

              if (!description) {
                problems.push(`${url}: Missing meta description`);
              }

              if (title) {
                if (
                  titles.has(title) &&
                  titles.get(title) !== finalUrl
                ) {
                  problems.push(
                    `Duplicate title: ${url} and ${titles.get(title)}`
                  );
                } else {
                  titles.set(title, finalUrl);
                }
              }

              if (description) {
                if (
                  descriptions.has(description) &&
                  descriptions.get(description) !== finalUrl
                ) {
                  problems.push(
                    `Duplicate description: ${url} and ${descriptions.get(description)}`
                  );
                } else {
                  descriptions.set(description, finalUrl);
                }
              }

              $("a[href]").each((_, element) => {
                const href = $(element).attr("href");
                if (!href) return;

                try {
                  const link = normalizeUrl(href, finalUrl);
                  const parsed = new URL(link);

                  if (
                    parsed.origin === origin &&
                    ["http:", "https:"].includes(parsed.protocol) &&
                    !visited.has(link) &&
                    !queued.has(link)
                  ) {
                    queue.push(link);
                    queued.add(link);
                  }
                } catch {}
              });

              console.log(`Checked: ${url}`);
            } catch (error) {
              problems.push(`${url}: ${error.message}`);
            }
          }

          async function main() {
            while (queue.length && visited.size < maxPages) {
              const url = queue.shift();

              if (visited.has(url)) continue;

              visited.add(url);
              await checkPage(url);
            }

            console.log(`Pages checked: ${visited.size}`);
            console.log(`Issues found: ${problems.length}`);

            if (problems.length) {
              console.log("\nSEO issues:");
              problems.forEach(issue =>
                console.log(`- ${issue}`)
              );
              process.exitCode = 1;
            }
          }

          main().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
